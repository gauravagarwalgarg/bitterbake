<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VulnCanvas Dashboard</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-slate-900 text-white shadow-lg">
      <div class="max-w-7xl mx-auto py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
          <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          VulnCanvas
        </h1>
        <div class="text-sm text-slate-400">Zero-Trust Local Engine</div>
      </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full py-8 px-6 flex flex-col gap-8">
      
      <!-- Ingestion Section -->
      <section id="ingestion-section" class="bg-white rounded-xl shadow p-8 border border-slate-200">
        <h2 class="text-xl font-semibold mb-4 text-slate-800">Data Ingestion</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div id="drop-zone-cve" class="border-2 border-dashed border-slate-300 rounded-lg p-10 flex flex-col items-center justify-center text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-colors">
            <svg class="w-10 h-10 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <span class="font-medium text-slate-700">Drop CVE JSON file here</span>
            <span class="text-sm text-slate-500 mt-1">or click to select</span>
            <span id="cve-file-name" class="text-xs text-indigo-600 mt-2 font-semibold"></span>
            <input type="file" id="file-input-cve" class="hidden" accept=".json" />
          </div>
          <div id="drop-zone-spdx" class="border-2 border-dashed border-slate-300 rounded-lg p-10 flex flex-col items-center justify-center text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition-colors">
             <svg class="w-10 h-10 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <span class="font-medium text-slate-700">Drop SPDX SBOM (Optional)</span>
            <span class="text-sm text-slate-500 mt-1">or click to select</span>
            <span id="spdx-file-name" class="text-xs text-indigo-600 mt-2 font-semibold"></span>
            <input type="file" id="file-input-spdx" class="hidden" accept=".json" />
          </div>
        </div>
        <div class="mt-6 flex justify-end">
          <button id="btn-process" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg shadow-sm transition-colors opacity-50 cursor-not-allowed" disabled>
            Process Data
          </button>
        </div>
      </section>

      <!-- Dashboard Section (Hidden initially) -->
      <section id="dashboard-section" class="hidden flex flex-col gap-8">
        
        <!-- Metrics -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4" id="metrics-container">
          <!-- Populated by JS -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- Chart -->
          <div class="bg-white rounded-xl shadow p-6 border border-slate-200 lg:col-span-1">
            <h3 class="text-lg font-semibold mb-4 text-slate-800">Risk Distribution</h3>
            <div class="relative h-64">
              <canvas id="risk-chart"></canvas>
            </div>
          </div>
          
          <!-- Data Table -->
          <div class="bg-white rounded-xl shadow p-6 border border-slate-200 lg:col-span-2 flex flex-col">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-semibold text-slate-800">Vulnerabilities</h3>
              <input type="text" id="search-input" placeholder="Search CVE..." class="px-3 py-1.5 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div class="overflow-x-auto flex-grow">
              <table class="min-w-full text-left text-sm whitespace-nowrap">
                <thead class="uppercase tracking-wider border-b-2 border-slate-200 text-slate-500 font-semibold bg-slate-50">
                  <tr>
                    <th scope="col" class="px-4 py-3 cursor-pointer hover:text-slate-800" data-sort="id">CVE ID <span>&#8597;</span></th>
                    <th scope="col" class="px-4 py-3 cursor-pointer hover:text-slate-800" data-sort="severity">Severity <span>&#8597;</span></th>
                    <th scope="col" class="px-4 py-3 cursor-pointer hover:text-slate-800" data-sort="score">Score <span>&#8597;</span></th>
                    <th scope="col" class="px-4 py-3">Packages</th>
                  </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-100 text-slate-700">
                  <!-- Populated by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
      
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
